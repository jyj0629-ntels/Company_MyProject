<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>키움 예약 매수</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <h1>키움 예약 매수</h1>
        <p class="subtitle">평일 09:00 자동 매수 예약 (기본: 안전 모의주문)</p>
      </header>

      <section class="card">
        <div class="toolbar">
          <button id="addRowBtn" type="button">종목 추가</button>
          <button id="healthBtn" type="button" class="ghost">연결 점검</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>종목코드</th>
                <th>종목명</th>
                <th>시장가</th>
                <th>구매가(원)</th>
                <th>구매 주식수</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div class="footer-actions">
          <button id="reserveBtn" type="button" class="primary">예약 구매</button>
        </div>
      </section>

      <section class="card" id="resultCard">
        <h2>결과</h2>
        <div id="resultText">아직 예약 결과가 없습니다.</div>
        <div id="resultTableWrap"></div>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td><input class="code" type="text" maxlength="6" placeholder="005930" /></td>
        <td><input class="name" type="text" placeholder="삼성전자" /></td>
        <td>
          <label class="check-wrap">
            <input class="is-market" type="checkbox" checked />
            <span>시장가</span>
          </label>
        </td>
        <td><input class="price" type="text" disabled placeholder="시장가" /></td>
        <td><input class="qty" type="number" min="1" step="1" value="1" /></td>
        <td><button class="remove" type="button">삭제</button></td>
      </tr>
    </template>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
