<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Music · 키움증권 자동 매매</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body {
            font-family:'Segoe UI','Malgun Gothic',sans-serif; color:#e2e8f0; line-height:1.6; min-height:100vh;
            background:radial-gradient(60vw 60vh at 15% 5%,rgba(99,102,241,.55),transparent 60%),
                radial-gradient(50vw 50vh at 90% 25%,rgba(236,72,153,.45),transparent 55%),
                linear-gradient(135deg,#0f172a,#1e1b4b);
        }
        .nav{position:sticky;top:16px;margin:16px auto 0;max-width:900px;display:flex;align-items:center;
            gap:18px;padding:14px 20px;border-radius:18px;background:rgba(255,255,255,.07);
            backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12)}
        .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:#fff}
        .logo .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
            background:linear-gradient(135deg,#6366f1,#a855f7)}
        .links{margin-left:auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
        .nav a{color:#c7d2fe;text-decoration:none;font-size:.92rem;transition:.2s}.nav a:hover{color:#fff}
        .container { max-width: 900px; margin: 28px auto; padding:0 20px; }
        #readme {
            background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
            border-radius: 18px; padding: 1.8rem 2rem; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            color:#e2e8f0;
        }
        #readme h1,#readme h2,#readme h3{color:#fff}
        #readme a{color:#c4b5fd}
        #readme pre { background: rgba(0,0,0,.35); padding: 1rem; border-radius: 8px; overflow-x: auto; }
        #readme code { background: rgba(0,0,0,.35); padding: 0.15em 0.35em; border-radius: 4px; }
        #readme pre code { background: none; padding: 0; }
        #readme table { border-collapse: collapse; }
        #readme th,#readme td { border: 1px solid rgba(255,255,255,.2); padding: 0.4rem 0.7rem; }
    </style>
</head>

<body>
    <nav class="nav"><span class="logo"><span class="dot">♪</span> Mr.Music</span>
      <span class="links">
        <a href="../ETF_Stock_P/index.html">ETF</a>
        <a href="../SnowPark_P/index.html">SnowPark</a>
        <a href="../AirTicket_P/index.html">항공권</a>
        <a href="../Kiwoom/index.html">키움</a>
        <a href="../MyAI/index.html">MyAI</a>
        <a href="../index.html">← 허브</a>
      </span></nav>

    <div class="container">
        <div id="readme">불러오는 중...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('./README.md')
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('README.md를 불러오지 못했습니다 (HTTP ' + response.status + ')');
                }
                return response.text();
            })
            .then(function (markdown) {
                document.getElementById('readme').innerHTML = marked.parse(markdown);
            })
            .catch(function (error) {
                document.getElementById('readme').textContent = error.message;
            });
    </script>
</body>

</html>
