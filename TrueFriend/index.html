<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국투자증권 자동 매매</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            text-decoration: none;
            color: #1a1a1a;
        }

        #readme {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 1.5rem 2rem;
        }

        #readme pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
        }

        #readme code {
            background: #f5f5f5;
            padding: 0.15em 0.35em;
            border-radius: 4px;
        }

        #readme pre code {
            background: none;
            padding: 0;
        }

        #readme table {
            border-collapse: collapse;
        }

        #readme th,
        #readme td {
            border: 1px solid #ccc;
            padding: 0.4rem 0.7rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="back-link" href="../index.html">&larr; 프로젝트 목록으로</a>
        <div id="readme">불러오는 중...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('./README.md')
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('README.md를 불러오지 못했습니다 (HTTP ' + response.status + ')');
                }
                return response.text();
            })
            .then(function (markdown) {
                document.getElementById('readme').innerHTML = marked.parse(markdown);
            })
            .catch(function (error) {
                document.getElementById('readme').textContent = error.message;
            });
    </script>
</body>

</html>
