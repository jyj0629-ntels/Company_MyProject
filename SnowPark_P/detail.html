<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 상세</title>
    <style>
        :root {
            --navy: #1a3a5a;
            --blue: #3498db;
            --green: #2ecc71;
            --sat: #2d6cdf;
            --sun: #e74c3c;
        }

        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #eef2f3; margin: 0; padding: 20px; color: #333; }
        .wrap { max-width: 860px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.06); border: 1px solid #ddd; }
        .card-header { background: var(--navy); color: white; padding: 18px 22px; }
        .card-header .resort { font-size: 1.3em; font-weight: 800; }
        .card-header .date { font-size: 0.95em; opacity: 0.95; margin-top: 4px; }
        .card-header .date .sat { color: #bcd6ff; font-weight: 700; }
        .card-header .date .sun { color: #ffc9c0; font-weight: 700; }
        .card-body { padding: 22px; }

        .summary { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid #eef0f3; padding-bottom: 18px; margin-bottom: 18px; }
        .summary-icon { font-size: 3.6em; line-height: 1; }
        .summary-temp { font-size: 2.6em; font-weight: 800; color: var(--navy); }
        .summary-desc { color: #555; font-size: 1em; margin-top: 2px; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 22px; }
        .stat { background: #f8f9fa; border: 1px solid #e5e9ee; border-radius: 10px; padding: 12px; text-align: center; }
        .stat .label { font-size: 0.78em; color: #7f8c8d; }
        .stat .value { font-size: 1.15em; font-weight: 800; color: var(--navy); margin-top: 4px; }
        .stat .value.snow { color: var(--blue); }

        h3 { color: var(--navy); font-size: 1.05em; margin: 0 0 12px; }
        table.hours { width: 100%; border-collapse: collapse; font-size: 0.88em; }
        table.hours th, table.hours td { padding: 9px 8px; border-bottom: 1px solid #eef0f3; text-align: center; }
        table.hours thead th { background: #f3f6fb; color: #7f8c8d; font-weight: 600; position: sticky; top: 0; }
        table.hours td.time { font-weight: 700; color: var(--navy); }
        table.hours td.tmp { font-weight: 700; }
        table.hours .snow { color: var(--blue); font-weight: 700; }
        .table-scroll { max-height: 460px; overflow-y: auto; border: 1px solid #eef0f3; border-radius: 10px; }

        .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 150px; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; border: none; cursor: pointer; font-size: 1em; transition: 0.2s; }
        .btn-webcam { background: var(--green); color: white; }
        .btn-close { background: #95a5a6; color: white; }
        .btn:hover { opacity: 0.88; transform: translateY(-2px); }

        .loading { color: #95a5a6; text-align: center; padding: 40px 0; }
        .error { color: #e74c3c; text-align: center; padding: 30px 0; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="card-header">
                <div class="resort" id="resortName">-</div>
                <div class="date" id="dateLabel">-</div>
            </div>
            <div class="card-body" id="body">
                <div class="loading">날씨 상세 정보를 불러오는 중...</div>
            </div>
        </div>
    </div>

    <script>
        var DOW_KO = ["일", "월", "화", "수", "목", "금", "토"];

        function qp(name) {
            var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
            return m ? decodeURIComponent(m[1]) : "";
        }

        function describeWeather(code) {
            var map = {
                0: ["☀️", "맑음"],
                1: ["🌤️", "대체로 맑음"], 2: ["⛅", "구름 조금"], 3: ["☁️", "흐림"],
                45: ["🌫️", "안개"], 48: ["🌫️", "짙은 안개"],
                51: ["🌦️", "약한 이슬비"], 53: ["🌦️", "이슬비"], 55: ["🌧️", "강한 이슬비"],
                61: ["🌧️", "약한 비"], 63: ["🌧️", "비"], 65: ["🌧️", "강한 비"],
                66: ["🌧️", "진눈깨비"], 67: ["🌧️", "강한 진눈깨비"],
                71: ["🌨️", "약한 눈"], 73: ["🌨️", "눈"], 75: ["❄️", "강한 눈"], 77: ["🌨️", "싸락눈"],
                80: ["🌦️", "약한 소나기"], 81: ["🌧️", "소나기"], 82: ["⛈️", "강한 소나기"],
                85: ["🌨️", "약한 눈소나기"], 86: ["❄️", "강한 눈소나기"],
                95: ["⛈️", "뇌우"], 96: ["⛈️", "뇌우(우박)"], 99: ["⛈️", "강한 뇌우(우박)"]
            };
            return map[code] || ["🌡️", "정보 없음"];
        }

        function fmt(v, unit) {
            if (v === null || v === undefined || isNaN(v)) return "-";
            return v + (unit || "");
        }

        function fmtTemp(v) {
            if (v === null || v === undefined || isNaN(v)) return "-";
            return Math.round(v) + "°";
        }

        function hhmm(iso) {
            if (!iso) return "-";
            var t = iso.split("T")[1] || "";
            return t.slice(0, 5);
        }

        var name = qp("name");
        var lat = qp("lat");
        var lon = qp("lon");
        var date = qp("date");           // YYYY-MM-DD
        var webcam = qp("webcam");

        // 헤더 표시
        document.getElementById("resortName").textContent = name || "스키장";
        if (date) {
            var dObj = new Date(date + "T00:00:00");
            var dow = dObj.getDay();
            var dowClass = dow === 6 ? "sat" : (dow === 0 ? "sun" : "");
            var label = (dObj.getMonth() + 1) + "월 " + dObj.getDate() + "일 (" +
                '<span class="' + dowClass + '">' + DOW_KO[dow] + '</span>)';
            document.getElementById("dateLabel").innerHTML = label +
                ((dow === 6 || dow === 0) ? " · 주말" : "");
            document.title = (name || "스키장") + " " + (dObj.getMonth() + 1) + "/" + dObj.getDate() + " 날씨 상세";
        }

        function buildUrl() {
            var params = [
                "latitude=" + lat,
                "longitude=" + lon,
                "hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,snowfall,wind_speed_10m,relative_humidity_2m",
                "daily=weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset",
                "timezone=Asia%2FSeoul",
                "start_date=" + date,
                "end_date=" + date
            ];
            return "https://api.open-meteo.com/v1/forecast?" + params.join("&");
        }

        function render(data) {
            var body = document.getElementById("body");
            var daily = data.daily || {};
            var hourly = data.hourly || {};
            var d = describeWeather(daily.weather_code ? daily.weather_code[0] : null);

            var tMax = daily.temperature_2m_max ? daily.temperature_2m_max[0] : null;
            var tMin = daily.temperature_2m_min ? daily.temperature_2m_min[0] : null;
            var snowSum = daily.snowfall_sum ? daily.snowfall_sum[0] : null;
            var popMax = daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
            var windMax = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[0] : null;
            var sunrise = daily.sunrise ? daily.sunrise[0] : null;
            var sunset = daily.sunset ? daily.sunset[0] : null;

            var rows = "";
            var times = hourly.time || [];
            for (var i = 0; i < times.length; i++) {
                var hd = describeWeather(hourly.weather_code ? hourly.weather_code[i] : null);
                var snow = hourly.snowfall ? hourly.snowfall[i] : null;
                rows +=
                    '<tr>' +
                        '<td class="time">' + hhmm(times[i]) + '</td>' +
                        '<td>' + hd[0] + '</td>' +
                        '<td class="tmp">' + fmtTemp(hourly.temperature_2m ? hourly.temperature_2m[i] : null) + '</td>' +
                        '<td>' + fmtTemp(hourly.apparent_temperature ? hourly.apparent_temperature[i] : null) + '</td>' +
                        '<td>' + fmt(hourly.precipitation_probability ? hourly.precipitation_probability[i] : null, "%") + '</td>' +
                        '<td class="' + (snow && snow > 0 ? "snow" : "") + '">' + (snow && snow > 0 ? snow + "cm" : "-") + '</td>' +
                        '<td>' + fmt(hourly.wind_speed_10m ? Math.round(hourly.wind_speed_10m[i]) : null, "km/h") + '</td>' +
                        '<td>' + fmt(hourly.relative_humidity_2m ? hourly.relative_humidity_2m[i] : null, "%") + '</td>' +
                    '</tr>';
            }

            body.innerHTML =
                '<div class="summary">' +
                    '<span class="summary-icon">' + d[0] + '</span>' +
                    '<div>' +
                        '<div class="summary-temp">' + fmtTemp(tMax) + ' <span style="font-size:0.5em;color:#7f8c8d;">/ ' + fmtTemp(tMin) + '</span></div>' +
                        '<div class="summary-desc">' + d[1] + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="stats">' +
                    '<div class="stat"><div class="label">최고 / 최저</div><div class="value">' + fmtTemp(tMax) + ' / ' + fmtTemp(tMin) + '</div></div>' +
                    '<div class="stat"><div class="label">강수확률(최대)</div><div class="value">' + fmt(popMax, "%") + '</div></div>' +
                    '<div class="stat"><div class="label">적설(합계)</div><div class="value snow">' + fmt(snowSum, "cm") + '</div></div>' +
                    '<div class="stat"><div class="label">최대풍속</div><div class="value">' + fmt(windMax != null ? Math.round(windMax) : null, "km/h") + '</div></div>' +
                    '<div class="stat"><div class="label">일출</div><div class="value">' + hhmm(sunrise) + '</div></div>' +
                    '<div class="stat"><div class="label">일몰</div><div class="value">' + hhmm(sunset) + '</div></div>' +
                '</div>' +
                '<h3>⏰ 시간대별 예보</h3>' +
                '<div class="table-scroll">' +
                    '<table class="hours">' +
                        '<thead><tr>' +
                            '<th>시각</th><th>날씨</th><th>기온</th><th>체감</th><th>강수%</th><th>적설</th><th>바람</th><th>습도</th>' +
                        '</tr></thead>' +
                        '<tbody>' + rows + '</tbody>' +
                    '</table>' +
                '</div>' +
                '<div class="actions">' +
                    (webcam ? '<a class="btn btn-webcam" href="' + webcam + '" target="_blank" rel="noopener">📹 실시간 웹캠/슬로프</a>' : '') +
                    '<button class="btn btn-close" type="button" onclick="window.close()">창 닫기</button>' +
                '</div>';
        }

        function load() {
            if (!lat || !lon || !date) {
                document.getElementById("body").innerHTML =
                    '<div class="error">필수 정보(위치/날짜)가 없습니다.</div>';
                return;
            }
            fetch(buildUrl())
                .then(function (res) {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.json();
                })
                .then(function (data) { render(data); })
                .catch(function (err) {
                    document.getElementById("body").innerHTML =
                        '<div class="error">날씨를 불러오지 못했습니다. ' + err.message + '</div>';
                });
        }

        load();
    </script>
</body>

</html>
